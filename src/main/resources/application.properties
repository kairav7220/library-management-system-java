spring.application.name=library-management-system-java

# Load secrets from .env in the project root (optional: file may not exist, e.g. on Render
# where secrets come from the dashboard instead). Parsed as a .properties-style file.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:5000}
server.forward-headers-strategy=framework

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?sslMode=REQUIRED&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia%2FKolkata
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

logging.level.dev.langchain4j.service.ToolErrorHandlingNotice=OFF

spring.thymeleaf.cache=false

langchain4j.mistral.api-key=${MISTRAL_API_KEY}
lumina.model=open-mistral-7b
