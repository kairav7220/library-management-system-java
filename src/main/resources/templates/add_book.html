<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Add book · Library')}"></head>
<body>
  <div class="page">
    <header th:replace="~{base :: topbar('Add book', 'books')}"></header>
    <div th:replace="~{base :: flash}"></div>

    <main class="panel">
      <div class="panel-head">
        <h2><i class="fa-solid fa-book-circle-plus"></i> Add book</h2>
        <a th:href="@{/books}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
      </div>
      <form class="edit-form" th:action="@{/books/add}" method="post">
        <div class="form-row">
          <div class="form-group">
            <label for="book_name"><i class="fa-solid fa-book"></i> Book name</label>
            <input id="book_name" type="text" name="book_name" required autocomplete="off">
          </div>
          <div class="form-group">
            <label for="book_author"><i class="fa-solid fa-pen"></i> Author</label>
            <input id="book_author" type="text" name="book_author" autocomplete="off">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="book_price"><i class="fa-solid fa-dollar-sign"></i> Price</label>
            <input id="book_price" type="number" step="0.01" name="book_price">
          </div>
          <div class="form-group">
            <label for="edition"><i class="fa-solid fa-layer-group"></i> Edition</label>
            <input id="edition" type="text" name="edition" autocomplete="off">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="book_cat"><i class="fa-solid fa-tag"></i> Category</label>
            <input id="book_cat" type="text" name="book_cat" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="book_genre"><i class="fa-solid fa-masks-theater"></i> Genre</label>
            <input id="book_genre" type="text" name="book_genre" autocomplete="off">
          </div>
        </div>
        <div class="form-group">
          <label for="publication"><i class="fa-solid fa-calendar"></i> Publication year</label>
          <input id="publication" type="text" name="publication" autocomplete="off">
        </div>
        <div class="form-actions">
          <a th:href="@{/books}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </main>

    <footer th:replace="~{base :: footer}"></footer>
  </div>

  <div th:replace="~{chat_widget :: widget}"></div>
</body>
</html>
