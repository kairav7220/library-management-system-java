<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Add user · Library')}"></head>
<body>
  <div class="page">
    <header th:replace="~{base :: topbar('Add user', 'users')}"></header>
    <div th:replace="~{base :: flash}"></div>

    <main class="panel">
      <div class="panel-head">
        <h2><i class="fa-solid fa-user-plus"></i> Add user</h2>
        <a th:href="@{/users}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
      </div>
      <form class="edit-form" th:action="@{/users/add}" method="post">
        <div class="form-row">
          <div class="form-group">
            <label for="user_type"><i class="fa-solid fa-user-tag"></i> User type</label>
            <input id="user_type" type="text" name="user_type" required autocomplete="off">
          </div>
          <div class="form-group">
            <label for="username"><i class="fa-solid fa-user"></i> Username</label>
            <input id="username" type="text" name="username" required autocomplete="off">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
            <input id="password" type="password" name="password" required>
          </div>
          <div class="form-group">
            <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
            <input id="email" type="email" name="email" required>
          </div>
        </div>
        <div class="form-group">
          <label for="phone"><i class="fa-solid fa-phone"></i> Phone</label>
          <input id="phone" type="text" name="phone" autocomplete="off">
        </div>
        <div class="form-actions">
          <a th:href="@{/users}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </main>

    <footer th:replace="~{base :: footer}"></footer>
  </div>

  <div th:replace="~{chat_widget :: widget}"></div>
</body>
</html>
