<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Book Genres · Library')}"></head>
<body>
  <div class="page">
    <header th:replace="~{base :: topbar('Book Genres', 'genres')}"></header>
    <div th:replace="~{base :: flash}"></div>

    <main class="panel">
      <div class="panel-head">
        <h2><i class="fa-solid fa-table-list"></i> Book Genres</h2>
        <a th:href="@{/book_genre/add}" class="btn btn-primary"><i class="fa-solid fa-plus"></i></a>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>genre_title</th>
              <th>book_names</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="genre : ${genres}">
              <td data-label="genre_title" th:text="${genre.genreTitle}">—</td>
              <td data-label="book_names" th:text="${genre.bookNames}">—</td>
              <td data-label="Actions">
                <div class="row-actions">
                  <a th:href="@{/book_genre/edit/{rowNum}(rowNum=${genre.rowNum})}" class="btn-icon edit-btn" title="Edit"><i class="fa-solid fa-pencil"></i></a>
                  <form th:action="@{/book_genre/delete/{rowNum}(rowNum=${genre.rowNum})}" method="post" style="display:inline" onsubmit="return confirm('Delete this genre?')"><button type="submit" class="btn-icon delete-btn" title="Delete"><i class="fa-solid fa-trash-can"></i></button></form>
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(genres)}">
              <td colspan="3" class="empty-state"><i class="fa-solid fa-inbox"></i><p>No genres found.</p></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer th:replace="~{base :: footer}"></footer>
  </div>

  <div th:replace="~{chat_widget :: widget}"></div>
</body>
</html>
