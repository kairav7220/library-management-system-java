<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Edit subscription · Library')}"></head>
<body>
  <div class="page">
    <header th:replace="~{base :: topbar('Edit subscription', 'subscriptions')}"></header>
    <div th:replace="~{base :: flash}"></div>

    <main class="panel">
      <div class="panel-head">
        <h2><i class="fa-solid fa-pen-to-square"></i> Edit subscription</h2>
        <a th:href="@{/subscriptions}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
      </div>

      <div class="summary-card">
        <span class="summary-avatar"><i class="fa-solid fa-clock-rotate-left"></i></span>
        <div class="summary-body">
          <h2 th:text="${subscription.memId}">MEM_1</h2>
          <p class="summary-meta">
            <li><i class="fa-solid fa-id-badge"></i> <span th:text="${subscription.transactionId}">TXN_1</span></li>
          </p>
        </div>
      </div>

      <p class="readonly-id" th:text="'row_num: ' + ${rowNum}">row_num: 1</p>

      <form class="edit-form" th:action="@{/subscriptions/edit/{rowNum}(rowNum=${rowNum})}" method="post">
        <div class="form-row">
          <div class="form-group">
            <label for="mem_id"><i class="fa-solid fa-user"></i> Member</label>
            <select id="mem_id" name="mem_id" required>
              <option value="">Select member…</option>
              <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.label}"
                      th:selected="${m.id == subscription.memId}">MEM_1 — Member</option>
            </select>
          </div>
          <div class="form-group">
            <label for="plan_mode"><i class="fa-solid fa-clock"></i> Plan mode</label>
            <input id="plan_mode" type="text" name="plan_mode" th:value="${subscription.planMode}" placeholder="monthly / yearly" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="mem_subscription_amount"><i class="fa-solid fa-dollar-sign"></i> Amount</label>
            <input id="mem_subscription_amount" type="number" step="0.01" name="mem_subscription_amount"
                   th:value="${subscription.memSubscriptionAmount}" required>
          </div>
          <div class="form-group">
            <label for="plan_type"><i class="fa-solid fa-tag"></i> Plan type</label>
            <input id="plan_type" type="text" name="plan_type" th:value="${subscription.planType}" autocomplete="off">
          </div>
        </div>
        <div class="form-group">
          <label for="subscription_status"><i class="fa-solid fa-toggle-on"></i> Status (0 = active, 1 = deleted)</label>
          <input id="subscription_status" type="text" name="subscription_status" th:value="${subscription.subscriptionStatus}" required>
        </div>
        <div class="form-actions">
          <a th:href="@{/subscriptions}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </main>

    <footer th:replace="~{base :: footer}"></footer>
  </div>

  <div th:replace="~{chat_widget :: widget}"></div>
</body>
</html>
