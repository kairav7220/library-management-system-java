<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Employees · Library')}"></head>
<body>
  <div class="page">
    <header th:replace="~{base :: topbar('Employees', 'employees')}"></header>
    <div th:replace="~{base :: flash}"></div>

    <main class="panel">
      <div class="panel-head">
        <h2><i class="fa-solid fa-table-list"></i> Employees</h2>
        <a th:href="@{/employees/add}" class="btn btn-primary"><i class="fa-solid fa-plus"></i></a>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>name</th>
              <th>user_id</th>
              <th>email</th>
              <th>phone</th>
              <th>designation</th>
              <th>salary</th>
              <th>user_row_num</th>
              <th>permanent_address</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="employee : ${employees}">
              <td data-label="name" th:text="${employee.name}">—</td>
              <td data-label="user_id" th:text="${employee.userId}">—</td>
              <td data-label="email" th:text="${employee.email}">—</td>
              <td data-label="phone" th:text="${employee.phone}">—</td>
              <td data-label="designation" th:text="${employee.designation}">—</td>
              <td data-label="salary" th:text="${employee.salary}">—</td>
              <td data-label="user_row_num" th:text="${employee.userRowNum}">—</td>
              <td data-label="permanent_address" th:text="${employee.permanentAddress}">—</td>
              <td data-label="Actions">
                <div class="row-actions">
                  <a th:href="@{/employees/edit/{rowNum}(rowNum=${employee.rowNum})}" class="btn-icon edit-btn" title="Edit"><i class="fa-solid fa-pencil"></i></a>
                  <form th:action="@{/employees/delete/{rowNum}(rowNum=${employee.rowNum})}" method="post" style="display:inline" onsubmit="return confirm('Delete this employee?')"><button type="submit" class="btn-icon delete-btn" title="Delete"><i class="fa-solid fa-trash-can"></i></button></form>
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
              <td colspan="9" class="empty-state"><i class="fa-solid fa-inbox"></i><p>No active employees found.</p></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer th:replace="~{base :: footer}"></footer>
  </div>

  <div th:replace="~{chat_widget :: widget}"></div>
</body>
</html>
