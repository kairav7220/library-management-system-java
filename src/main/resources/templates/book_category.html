<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Book Categories · Library')}"></head>
<body>
  <div class="page">
    <header th:replace="~{base :: topbar('Book Categories', 'categories')}"></header>
    <div th:replace="~{base :: flash}"></div>

    <main class="panel">
      <div class="panel-head">
        <h2><i class="fa-solid fa-table-list"></i> Book Categories</h2>
        <a th:href="@{/book_cat/add}" class="btn btn-primary"><i class="fa-solid fa-plus"></i></a>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>cat_name</th>
              <th>description</th>
              <th>book_names</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="category : ${categories}">
              <td data-label="cat_name" th:text="${category.catName}">—</td>
              <td data-label="description" th:text="${category.description}">—</td>
              <td data-label="book_names" th:text="${category.bookNames}">—</td>
              <td data-label="Actions">
                <div class="row-actions">
                  <a th:href="@{/book_cat/edit/{rowNum}(rowNum=${category.rowNum})}" class="btn-icon edit-btn" title="Edit"><i class="fa-solid fa-pencil"></i></a>
                  <form th:action="@{/book_cat/delete/{rowNum}(rowNum=${category.rowNum})}" method="post" style="display:inline" onsubmit="return confirm('Delete this category?')"><button type="submit" class="btn-icon delete-btn" title="Delete"><i class="fa-solid fa-trash-can"></i></button></form>
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categories)}">
              <td colspan="4" class="empty-state"><i class="fa-solid fa-inbox"></i><p>No categories found.</p></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer th:replace="~{base :: footer}"></footer>
  </div>

  <div th:replace="~{chat_widget :: widget}"></div>
</body>
</html>
