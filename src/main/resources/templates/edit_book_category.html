<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Edit book category · Library')}"></head>
<body>
  <div class="page">
    <header th:replace="~{base :: topbar('Edit book category', 'categories')}"></header>
    <div th:replace="~{base :: flash}"></div>

    <main class="panel">
      <div class="panel-head">
        <h2><i class="fa-solid fa-pen-to-square"></i> Edit category</h2>
        <a th:href="@{/book_cat}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
      </div>

      <div class="summary-card">
        <span class="summary-avatar"><i class="fa-solid fa-tag"></i></span>
        <div class="summary-body">
          <h2 th:text="${category.catName}">Category</h2>
          <p class="summary-meta">
            <li><i class="fa-solid fa-id-badge"></i> <span th:text="${category.catId}">CAT_1</span></li>
          </p>
        </div>
      </div>

      <p class="readonly-id" th:text="'row_num: ' + ${rowNum}">row_num: 1</p>

      <form class="edit-form" th:action="@{/book_cat/edit/{rowNum}(rowNum=${rowNum})}" method="post">
        <div class="form-group">
          <label for="cat_name"><i class="fa-solid fa-tag"></i> Category name</label>
          <input id="cat_name" type="text" name="cat_name" th:value="${category.catName}" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="description"><i class="fa-solid fa-align-left"></i> Description</label>
          <input id="description" type="text" name="description" th:value="${category.description}" autocomplete="off">
        </div>
        <div class="form-actions">
          <a th:href="@{/book_cat}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </main>

    <footer th:replace="~{base :: footer}"></footer>
  </div>

  <div th:replace="~{chat_widget :: widget}"></div>
</body>
</html>
