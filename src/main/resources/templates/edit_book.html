<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Edit book · Library')}"></head>
<body>
  <div class="page">
    <header th:replace="~{base :: topbar('Edit book', 'books')}"></header>
    <div th:replace="~{base :: flash}"></div>

    <main class="panel">
      <div class="panel-head">
        <h2><i class="fa-solid fa-book-open-reader"></i> Edit book</h2>
        <a th:href="@{/books}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
      </div>

      <div class="summary-card">
        <span class="summary-avatar"><i class="fa-solid fa-book"></i></span>
        <div class="summary-body">
          <h2 th:text="${book.bookName}">Book</h2>
          <p class="summary-meta">
            <li><i class="fa-solid fa-id-badge"></i> <span th:text="${book.bookId}">BOOK_1</span></li>
            <li th:classappend="${book.status == 0} ? 'ok' : 'bad'">
              <i class="fa-solid fa-circle-check" th:if="${book.status == 0}"></i>
              <i class="fa-solid fa-circle-xmark" th:unless="${book.status == 0}"></i>
              <span th:text="${book.status == 0} ? 'Active' : 'Deleted'">Active</span>
            </li>
          </p>
        </div>
      </div>

      <p class="readonly-id" th:text="'row_num: ' + ${rowNum}">row_num: 1</p>

      <form class="edit-form" th:action="@{/books/edit/{rowNum}(rowNum=${rowNum})}" method="post">
        <div class="form-row">
          <div class="form-group">
            <label for="book_name"><i class="fa-solid fa-book"></i> Book name</label>
            <input id="book_name" type="text" name="book_name" th:value="${book.bookName}" required autocomplete="off">
          </div>
          <div class="form-group">
            <label for="book_author"><i class="fa-solid fa-pen"></i> Author</label>
            <input id="book_author" type="text" name="book_author" th:value="${book.bookAuthor}" autocomplete="off">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="book_price"><i class="fa-solid fa-dollar-sign"></i> Price</label>
            <input id="book_price" type="number" step="0.01" name="book_price" th:value="${book.bookPrice}">
          </div>
          <div class="form-group">
            <label for="edition"><i class="fa-solid fa-layer-group"></i> Edition</label>
            <input id="edition" type="text" name="edition" th:value="${book.edition}" autocomplete="off">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="book_cat"><i class="fa-solid fa-tag"></i> Category</label>
            <input id="book_cat" type="text" name="book_cat" th:value="${book.bookCat}" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="book_genre"><i class="fa-solid fa-masks-theater"></i> Genre</label>
            <input id="book_genre" type="text" name="book_genre" th:value="${book.bookGenre}" autocomplete="off">
          </div>
        </div>
        <div class="form-group">
          <label for="publication"><i class="fa-solid fa-calendar"></i> Publication year</label>
          <input id="publication" type="text" name="publication" th:value="${book.publication}" autocomplete="off">
        </div>
        <div class="form-actions">
          <a th:href="@{/books}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </main>

    <footer th:replace="~{base :: footer}"></footer>
  </div>

  <div th:replace="~{chat_widget :: widget}"></div>
</body>
</html>
