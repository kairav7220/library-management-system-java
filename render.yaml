services:
  - type: web
    name: library-management-system-java
    runtime: java
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/library-management-system-java-0.0.1-SNAPSHOT.jar
    healthCheckPath: /login
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_DB
        value: library_db
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: LUMINA_MODEL
        value: open-mistral-7b
      - key: LUMINA_FINE_PER_DAY
        value: "10"
