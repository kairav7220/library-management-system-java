services:
  - type: web
    name: library-management-system-java
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_DB
        value: library_db
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: LUMINA_MODEL
        value: open-mistral-7b
      - key: LUMINA_FINE_PER_DAY
        value: "10"
